name: diffsynth
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core Deep Learning
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio>=2.0.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8

  # Scientific Computing
  - numpy>=1.24.0
  - scipy>=1.11.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Utilities
  - pyyaml
  - tqdm
  - jupyter
  - ipython

  # Video Processing
  - ffmpeg
  - opencv

  # Development
  - black
  - flake8
  - pytest

  # pip 安装的包
  - pip:
      # Hugging Face Ecosystem
      - transformers>=4.30.0
      - diffusers>=0.20.0
      - accelerate>=0.20.0
      - peft>=0.4.0
      - safetensors>=0.3.0
      - huggingface-hub>=0.16.0

      # Model Optimization
      - bitsandbytes>=0.41.0
      - xformers  # 可选，需要与 PyTorch 版本匹配

      # Video & Image Processing
      - opencv-python>=4.8.0
      - pillow>=10.0.0
      - imageio>=2.31.0
      - imageio-ffmpeg>=0.4.9
      - av>=10.0.0
      - decord>=0.6.0

      # Tokenization
      - sentencepiece>=0.1.99
      - protobuf>=3.20.0
      - tokenizers>=0.13.0

      # Safety Detection
      - nudenet>=2.0.0

      # LLM APIs
      - openai>=1.0.0
      - anthropic>=0.25.0

      # Data Management
      - jsonlines>=3.1.0
      - datasets>=2.14.0
      - python-dotenv>=1.0.0

      # Utilities
      - einops>=0.6.1
      - omegaconf>=2.3.0
      - hydra-core>=1.3.0

      # Monitoring
      - tensorboard>=2.13.0
      - wandb>=0.15.0
